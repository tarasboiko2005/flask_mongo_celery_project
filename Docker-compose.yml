services:
  web:
    build: .
    container_name: flask_app
    command: gunicorn -w 2 -b 0.0.0.0:8000 wsgi:app
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - mongo
      - redis
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - .:/app

  worker:
    build: .
    container_name: celery_worker
    command: celery -A app.celery_app.celery_app worker --loglevel=INFO
    env_file: .env
    depends_on:
      web:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

  beat:
    build: .
    container_name: celery_beat
    command: celery -A app.celery_app.celery_app beat --loglevel=INFO
    env_file: .env
    depends_on:
      web:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

  mcp:
    build: .
    container_name: mcp_server
    command: python -m app.mcp.server
    env_file: .env
    depends_on:
      web:
        condition: service_healthy
      worker:
        condition: service_started
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - "9000:9000"
    volumes:
      - .:/app

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:6
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"const r=db.runCommand({ ping: 1 }); if (!r.ok) { quit(2) }\""]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  mongo_data:
